name: Verify unified platform

on:
  push:
  pull_request:

jobs:
  focused:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            packages/iseol/package-lock.json
            packages/claimlatch/package-lock.json
            integrations/claimlatch-adapter/package-lock.json
            apps/desktop/chat-ui/package-lock.json
      - name: Install EEEE dependencies
        run: python -m pip install -e ".\apps\eeee[dev]"
      - name: Install TypeScript dependencies
        run: |
          npm ci --prefix packages/iseol
          npm ci --prefix integrations/claimlatch-adapter
      - name: Check repository hygiene
        shell: pwsh
        run: .\scripts\check-repository.ps1
      - name: Check tracked text encoding
        run: python .\scripts\check-encoding.py
      - name: Build Gleave chat UI
        shell: pwsh
        run: |
          npm ci --prefix apps/desktop/chat-ui --ignore-scripts --no-audit
          npm run build --prefix apps/desktop/chat-ui
      - name: Test Gleave conversation, workspace, and Codex contracts
        working-directory: apps/eeee
        shell: pwsh
        run: |
          python -m pytest -q tests/chat_scopes tests/conversations tests/api/test_workspace_routes.py tests/api/test_chat_frontend.py tests/api/test_conversation_routes.py tests/api/test_codex_routes.py tests/api/test_codex_protocol.py tests/api/test_codex_journal.py
      - name: Build and test ISEOL contracts, QA, and organization
        working-directory: packages/iseol
        shell: pwsh
        run: |
          npm run build --silent
          node --import tsx --test tests/integrations/contracts.test.ts tests/qa/independent-runner.test.ts tests/qa/qa-orchestrator.test.ts tests/qa/release-gate.test.ts tests/agent-organization/team-composer.test.ts tests/agent-organization/qa-baseline.test.ts
      - name: Run EEEE focused tests
        working-directory: apps/eeee
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ..\..\var | Out-Null
          python -m pytest -q --basetemp ..\..\var\pytest-ci tests\integrations tests\memory tests\trust tests\assistant tests\project_runtime tests\mobile tests\e2e tests\coordinator\test_memory_project_flow.py tests\api\test_memory_api.py
      - name: Test ClaimLatch adapter
        run: npm test --silent --prefix integrations/claimlatch-adapter
